<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Theme Studio</title>

<style>
:root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface-2: #f0f0f3;
    --border: #e3e3e8;
    --text: #17171a;
    --muted: #85858d;
    --accent: #ff4fa3;
    --shadow: 0 8px 30px rgba(0,0,0,.06);
}

html[data-theme="dark"] {
    --bg: #0c0c0f;
    --surface: #151518;
    --surface-2: #1d1d21;
    --border: #29292f;
    --text: #f7f7f8;
    --muted: #92929a;
    --shadow: 0 12px 35px rgba(0,0,0,.25);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;
}

body {
    padding-bottom: 96px;
    transition:
        background .2s ease,
        color .2s ease;
}

button,
input {
    font-family: inherit;
}

button {
    border: 0;
}

.app {
    width: 100%;
    max-width: 680px;
    margin: auto;
    padding: 18px 15px 30px;
}

/* HEADER */

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: var(--text);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 16px;
}

.brand-name {
    font-size: 19px;
    font-weight: 750;
    letter-spacing: -.4px;
}

.brand-name span {
    color: var(--accent);
}

.theme-toggle {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 17px;
    box-shadow: var(--shadow);
}

/* NAME */

.name-wrap {
    margin-bottom: 13px;
}

.name-input {
    width: 100%;
    height: 52px;
    padding: 0 16px;
    border-radius: 15px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
    font-size: 15px;
    box-shadow: var(--shadow);
}

.name-input:focus {
    border-color: var(--accent);
}

/* PLATFORM */

.platform {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    margin-bottom: 14px;
    border-radius: 15px;
    background: var(--surface-2);
    border: 1px solid var(--border);
}

.platform button {
    height: 42px;
    border-radius: 11px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
}

.platform button.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

/* PREVIEW */

.preview-card {
    overflow: hidden;
    border-radius: 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
}

.preview-top {
    height: 58px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    background: #18181d;
    color: white;
}

.back {
    font-size: 28px;
    margin-right: 8px;
    line-height: 1;
}

.avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    margin-right: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
    background: var(--accent);
    color: white;
}

.preview-name {
    font-size: 13px;
    font-weight: 700;
}

.preview-status {
    font-size: 10px;
    opacity: .55;
    margin-top: 2px;
}

.chat {
    min-height: 380px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 8px;
    background: #111114;
    background-position: center;
    background-size: cover;
}

.message {
    max-width: 78%;
    padding: 9px 12px;
    color: white;
    font-size: 13px;
    line-height: 1.35;
}

.message.in {
    align-self: flex-start;
    background: #292930;
    border-radius: 16px 16px 16px 5px;
}

.message.out {
    align-self: flex-end;
    background: var(--accent);
    border-radius: 16px 16px 5px 16px;
}

.time {
    margin-top: 3px;
    text-align: right;
    font-size: 9px;
    opacity: .55;
}

.composer {
    height: 57px;
    padding: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #18181d;
}

.fake-input {
    flex: 1;
    height: 40px;
    padding: 11px 14px;
    border-radius: 20px;
    background: #111114;
    color: #888891;
    font-size: 12px;
}

.send {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
}

/* CARDS */

.card {
    padding: 16px;
    margin-bottom: 11px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}

.card-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
}

.card-title strong {
    font-size: 14px;
}

.card-title span {
    color: var(--muted);
    font-size: 11px;
}

/* COLORS */

.colors {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 11px;
}

.color-item label {
    display: block;
    margin-bottom: 6px;
    color: var(--muted);
    font-size: 10px;
}

.color-row {
    display: flex;
    gap: 6px;
}

.color-picker {
    width: 47px;
    height: 39px;
    padding: 3px;
    flex-shrink: 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
}

.hex {
    min-width: 0;
    width: 100%;
    height: 39px;
    padding: 0 9px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    outline: none;
    font-size: 10px;
}

.hex:focus {
    border-color: var(--accent);
}

/* PRESETS */

.presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.preset {
    height: 52px;
    border-radius: 13px;
    color: white;
    font-size: 10px;
    font-weight: 750;
}

/* IMAGE */

.upload {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 50px;
    border-radius: 13px;
    border: 1px dashed var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 12px;
    font-weight: 650;
}

.upload input {
    display: none;
}

.small-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 9px;
}

.small-actions button {
    height: 43px;
    border-radius: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 11px;
    font-weight: 700;
}

/* ACTIONS */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.action-button {
    height: 46px;
    border-radius: 13px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
}

.action-button.primary {
    background: var(--accent);
    color: white;
    border-color: transparent;
}

/* BOTTOM */

.bottom {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    display: flex;
    gap: 8px;
    padding: 9px 13px;
    padding-bottom: calc(9px + env(safe-area-inset-bottom));
    background: color-mix(
        in srgb,
        var(--bg) 92%,
        transparent
    );
    backdrop-filter: blur(18px);
    border-top: 1px solid var(--border);
}

.bottom button {
    height: 48px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 750;
}

.bottom-save {
    width: 38%;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
}

.bottom-create {
    width: 62%;
    background: var(--accent);
    color: white;
}

/* TOAST */

.toast {
    position: fixed;
    z-index: 999;
    left: 50%;
    top: 16px;
    transform: translateX(-50%) translateY(-10px);
    padding: 11px 15px;
    border-radius: 13px;
    background: var(--text);
    color: var(--bg);
    font-size: 11px;
    font-weight: 650;
    opacity: 0;
    pointer-events: none;
    transition: .2s ease;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* MOBILE */

@media (max-width: 430px) {

    .app {
        padding-left: 12px;
        padding-right: 12px;
    }

    .chat {
        min-height: 340px;
    }

    .colors {
        gap: 9px;
    }

    .presets {
        gap: 6px;
    }

    .preset {
        height: 48px;
    }
}
</style>
</head>

<script>

const SERVER =
    "https://theme-studio-production-ec43.up.railway.app";


let platform = "ios";


function $(id) {
    return document.getElementById(id);
}


/* PLATFORM */

function setPlatform(type) {

    platform = type;

    $("androidBtn")
        .classList
        .remove("active");

    $("iosBtn")
        .classList
        .remove("active");


    if (type === "android") {

        $("androidBtn")
            .classList
            .add("active");

    } else {

        $("iosBtn")
            .classList
            .add("active");

    }

}


/* THEME DATA */

function getTheme() {

    return {

        name:
            $("themeName")
            .value
            .trim()
            ||
            "Telegram Theme",

        platform:

            platform,

        colors: {

            background:
                $("bg").value,

            header:
                $("header").value,

            accent:
                $("accent").value,

            outgoing:
                $("outgoingColor").value,

            incoming:
                $("incomingColor").value,

            text:
                $("text").value,

            link:
                $("link").value,

            secondary:
                $("secondary").value

        }

    };

}


/* PREVIEW */

function applyTheme() {

    const theme =
        getTheme();


    $("chat")
        .style
        .backgroundColor =
        theme.colors.background;


    $("previewHeader")
        .style
        .backgroundColor =
        theme.colors.header;


    $("composer")
        .style
        .backgroundColor =
        theme.colors.header;


    $("avatar")
        .style
        .backgroundColor =
        theme.colors.accent;


    $("send")
        .style
        .backgroundColor =
        theme.colors.accent;


    document
        .querySelectorAll(".message.out")
        .forEach(
            element => {

                element.style.background =
                    theme.colors.outgoing;

            }
        );


    document
        .querySelectorAll(".message.in")
        .forEach(
            element => {

                element.style.background =
                    theme.colors.incoming;

            }
        );


    document
        .querySelectorAll(".message")
        .forEach(
            element => {

                element.style.color =
                    theme.colors.text;

            }
        );


    $("fakeInput")
        .style
        .color =
        theme.colors.secondary;

}


/* COLOR CONTROLS */

const colorPairs = [

    ["bg", "bgHex"],

    ["header", "headerHex"],

    ["accent", "accentHex"],

    ["outgoingColor", "outgoingColorHex"],

    ["incomingColor", "incomingColorHex"],

    ["text", "textHex"],

    ["link", "linkHex"],

    ["secondary", "secondaryHex"]

];


colorPairs.forEach(
    pair => {

        const color =
            $(pair[0]);

        const hex =
            $(pair[1]);


        color.addEventListener(
            "input",
            () => {

                hex.value =
                    color.value
                    .toUpperCase();

                applyTheme();

            }
        );


        hex.addEventListener(
            "change",
            () => {

                let value =
                    hex.value
                    .trim();


                if (
                    !/^#[0-9a-fA-F]{6}$/
                    .test(value)
                ) {

                    hex.value =
                        color.value
                        .toUpperCase();

                    return;

                }


                color.value =
                    value;


                applyTheme();

            }
        );

    }
);


/* PRESETS */

const presets = {

    pink: {

        background: "#111114",
        header: "#18181D",
        accent: "#FF4FA3",
        outgoing: "#FF4FA3",
        incoming: "#292930",
        text: "#FFFFFF",
        link: "#FF4FA3",
        secondary: "#9999A3"

    },


    black: {

        background: "#050505",
        header: "#101010",

/* WALLPAPER */

$("wallpaper")
    .addEventListener(
        "change",
        function(event) {

            const file =
                event.target
                    .files[0];


            if (!file)
                return;


            const url =
                URL.createObjectURL(file);


            $("chat")
                .style
                .backgroundImage =
                `url("${url}")`;


            toast("Фон установлен ✓");

        }
    );


function removeWallpaper() {

    $("chat")
        .style
        .backgroundImage =
        "none";


    $("wallpaper")
        .value =
        "";


    toast("Фон убран");

}


function randomGradient() {

    const gradients = [

        "linear-gradient(135deg,#ff4fa3,#7928ca)",

        "linear-gradient(135deg,#0f2027,#203a43,#2c5364)",

        "linear-gradient(135deg,#200122,#6f0000)",

        "linear-gradient(135deg,#141e30,#243b55)",

        "linear-gradient(135deg,#000428,#004e92)",

        "linear-gradient(135deg,#42275a,#734b6d)"

    ];


    $("chat")
        .style
        .backgroundImage =
        gradients[
            Math.floor(
                Math.random() *
                gradients.length
            )
        ];


    toast("Градиент установлен");

function saveTheme() {

    localStorage.setItem(
        "themeStudio",
        JSON.stringify(
            getTheme()
        )
    );


    toast("Тема сохранена ✓");

}


/* DOWNLOAD */

function downloadPreview() {

    const theme =
        getTheme();


    const blob =
        new Blob(
            [
                JSON.stringify(
                    theme,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        (
            theme.name
                .replace(
                    /[^a-zA-Z0-9а-яА-ЯёЁ_-]/g,
                    "_"
                )
            ||
            "telegram_theme"
        )
        +
        ".json";


    document.body
        .appendChild(link);


    link.click();


    link.remove();


    URL.revokeObjectURL(url);

}


/* CREATE */

async function createTelegramTheme() {

    toast("Создаю тему…");


    const theme =
        getTheme();


    try {

        const response =
            await fetch(
                SERVER +
                "/api/theme",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(theme)

                }
            );


        const result =
            await response.json();


        if (result.ok) {

            toast(
                "🎨 Тема отправлена в Telegram!"
            );

        } else {

            toast(
                "Ошибка: " +
                (
                    result.error ||
                    result.description ||
                    "неизвестная ошибка"
                )
            );

        }


    } catch (error) {

        console.error(error);

        toast(
            "Ошибка соединения с сервером"
        );

    }

}


/* APP THEME */

function toggleAppTheme() {

    const current =
        document.documentElement
            .getAttribute(
                "data-theme"
            );


    const next =
        current === "dark"
            ? "light"
            : "dark";


    document.documentElement
        .setAttribute(
            "data-theme",
            next
        );


    localStorage.setItem(
        "appTheme",
        next
    );


    $("themeToggle")
        .textContent =
        next === "dark"
            ? "☀️"
            : "🌙";

}


/* LOAD APP THEME */

function loadAppTheme() {

    const saved =
        localStorage.getItem(
            "appTheme"
        )
        ||
        "dark";


    document.documentElement
        .setAttribute(
            "data-theme",
            saved
        );


    $("themeToggle")
        .textContent =
        saved === "dark"
            ? "☀️"
            : "🌙";

}


/* LOAD SAVED */

function loadSavedTheme() {

    const saved =
        localStorage.getItem(
            "themeStudio"
        );


    if (!saved)
        return;


    try {

        const theme =
            JSON.parse(saved);


        if (theme.name) {

            $("themeName")
                .value =
                theme.name;

        }


        if (theme.platform) {

            setPlatform(
                theme.platform
            );

        }


        if (theme.colors) {

            const c =
                theme.colors;


            const fields = {

                bg:
                    c.background,

                header:
                    c.header,

                accent:
                    c.accent,

                outgoingColor:
                    c.outgoing,

                incomingColor:
                    c.incoming,

                text:
                    c.text,

                link:
                    c.link,

                secondary:
                    c.secondary

            };


            Object.keys(fields)
                .forEach(
                    id => {

                        if (!fields[id])
                            return;


                        $(id).value =
                            fields[id];


                        const hex =
                            $(id + "Hex");


                        if (hex) {

                            hex.value =
                                fields[id]
                                    .toUpperCase();

                        }

                    }
                );

        }


    } catch (error) {

        console.error(error);

    }

}


/* TOAST */

function toast(message) {

    const element =
        $("toast");


    element.textContent =
        message;


    element.classList
        .add("show");


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () => {

                element.classList
                    .remove("show");

            },
            2300
        );

}


/* START */

loadAppTheme();

loadSavedTheme();

applyTheme();
