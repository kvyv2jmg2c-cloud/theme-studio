<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#09090d">

<title>Telegram Theme Studio</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    background:#09090d;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    padding-bottom:100px;
}

.app{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:15px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.logo{
    font-size:23px;
    font-weight:800;
}

.logo span{
    color:#ff4fa3;
}

input,button{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.save{
    background:#18181e;
    color:white;
    padding:10px 14px;
    border-radius:12px;
}

.name{
    width:100%;
    height:48px;
    background:#15151a;
    border:1px solid #2b2b32;
    border-radius:14px;
    color:white;
    padding:0 14px;
    outline:none;
    margin-bottom:12px;
}

.platform{
    display:flex;
    gap:4px;
    background:#15151a;
    border:1px solid #292930;
    padding:4px;
    border-radius:15px;
    margin-bottom:14px;
}

.platform button{
    flex:1;
    height:44px;
    border-radius:11px;
    background:transparent;
    color:#888;
    font-weight:700;
}

.platform button.active{
    background:white;
    color:black;
}

.preview{
    overflow:hidden;
    border-radius:26px;
    border:1px solid #34343b;
    margin-bottom:14px;
}

.header-preview{
    height:60px;
    display:flex;
    align-items:center;
    padding:0 14px;
    background:#18181d;
}

.back{
    font-size:28px;
    margin-right:10px;
}

.avatar{
    width:37px;
    height:37px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    margin-right:10px;
}

.user{
    font-size:14px;
    font-weight:700;
}

.status{
    font-size:10px;
    opacity:.5;
}

.chat{
    min-height:390px;
    padding:14px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    gap:8px;
    background:#111114;
    background-position:center;
    background-size:cover;
}

.message{
    max-width:80%;
    padding:9px 12px;
    font-size:14px;
    line-height:1.3;
    color:white;
}

.in{
    align-self:flex-start;
    background:#292930;
    border-radius:17px;
}

.out{
    align-self:flex-end;
    background:#ff4fa3;
    border-radius:17px;
}

.time{
    text-align:right;
    font-size:9px;
    opacity:.55;
    margin-top:4px;
}

.composer{
    height:58px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
    background:#18181d;
}

.fake-input{
    flex:1;
    background:#111114;
    color:#999;
    border-radius:20px;
    padding:10px 14px;
    font-size:13px;
}

.send{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#ff4fa3;
    display:flex;
    align-items:center;
    justify-content:center;
}

.card{
    background:#15151a;
    border:1px solid #28282f;
    border-radius:19px;
    padding:15px;
    margin-bottom:11px;
}

.title{
    font-size:14px;
    font-weight:750;
    margin-bottom:13px;
}

.colors{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.color label{
    display:block;
    color:#92929b;
    font-size:10px;
    margin-bottom:5px;
}

.color input[type=color]{
    width:100%;
    height:47px;
    border:0;
    padding:3px;
    background:#101014;
    border-radius:12px;
}

.hex{
    width:100%;
    margin-top:5px;
    background:#101014;
    border:1px solid #303039;
    color:white;
    border-radius:9px;
    padding:7px 8px;
    outline:none;
    font-size:10px;
}

.actions{
    display:flex;
    gap:8px;
}

.actions button{
    flex:1;
    padding:13px 8px;
    border-radius:12px;
    background:#101014;
    border:1px solid #33333a;
    color:white;
    font-size:12px;
    font-weight:700;
}

.primary{
    background:white !important;
    color:black !important;
}

.presets{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.preset{
    height:54px;
    border-radius:14px;
    color:white;
    font-size:10px;
    font-weight:700;
}

.upload{
    display:block;
    text-align:center;
    padding:16px;
    border:1px dashed #44444d;
    border-radius:14px;
    color:#aaa;
    font-size:12px;
    background:#101014;
}

.upload input{
    display:none;
}

.bottom{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:50;
    display:flex;
    gap:8px;
    padding:10px 13px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    background:rgba(9,9,13,.94);
    border-top:1px solid #28282f;
    backdrop-filter:blur(18px);
}

.bottom button{
    flex:1;
    height:48px;
    border-radius:14px;
    background:#17171c;
    border:1px solid #33333b;
    color:white;
    font-weight:700;
}

.toast{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    color:black;
    padding:11px 15px;
    border-radius:14px;
    font-size:12px;
    display:none;
    z-index:999;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <div class="logo">Theme<span>Studio</span></div>
    <button class="save" onclick="saveTheme()">Сохранить</button>
</div>

<input
    id="themeName"
    class="name"
    value="Pink Night"
    placeholder="Название темы"
>

<div class="platform">

    <button id="androidBtn" onclick="setPlatform('android')">
        🤖 Android
    </button>

    <button id="iosBtn" class="active" onclick="setPlatform('ios')">
        🍎 iPhone
    </button>

</div>

<div class="preview">

    <div id="previewHeader" class="header-preview">

        <div class="back">‹</div>

        <div id="avatar" class="avatar">A</div>

        <div>
            <div class="user">Alex</div>
            <div class="status">в сети</div>
        </div>

    </div>

    <div id="chat" class="chat">

        <div id="incoming" class="message in">
            Привет! Как тебе новая тема?
            <div class="time">21:42</div>
        </div>

        <div id="outgoing" class="message out">
            Она шикарная 😍
            <div class="time">21:43 ✓✓</div>
        </div>

        <div class="message in">
            Особенно этот розовый.
            <div class="time">21:43</div>
        </div>

        <div class="message out">
            Я сам его выбрал 😎
            <div class="time">21:44 ✓✓</div>
        </div>

    </div>

    <div id="composer" class="composer">

        <div id="fakeInput" class="fake-input">
            Сообщение
        </div>

        <div id="send" class="send">➤</div>

    </div>

</div>

<div class="card">

<div class="title">Готовые стили</div>

<div class="presets">

<button class="preset"
style="background:linear-gradient(135deg,#ff4fa3,#7928ca)"
onclick="preset('pink')">Pink</button>

<button class="preset"
style="background:linear-gradient(135deg,#050505,#444)"
onclick="preset('black')">Black</button>

<button class="preset"
style="background:linear-gradient(135deg,#7b0000,#ff3030)"
onclick="preset('blood')">Blood</button>

<button class="preset"
style="background:linear-gradient(135deg,#162447,#1f8cff)"
onclick="preset('ocean')">Ocean</button>

<button class="preset"
style="background:linear-gradient(135deg,#24103f,#9b59ff)"
onclick="preset('purple')">Purple</button>

<button class="preset"
style="background:linear-gradient(135deg,#092e20,#2ecc71)"
onclick="preset('forest')">Forest</button>

<button class="preset"
style="background:linear-gradient(135deg,#111,#00e5ff)"
onclick="preset('cyber')">Cyber</button>

<button class="preset"
style="background:linear-gradient(135deg,#fff,#ddd);color:#111"
onclick="preset('minimal')">Minimal</button>

</div>
</div>

<div class="card">

<div class="title">Цвета</div>

<div class="colors">

<div class="color">
<label>Фон чата</label>
<input id="bg" type="color" value="#111114">
<input id="bgHex" class="hex" value="#111114">
</div>

<div class="color">
<label>Шапка</label>
<input id="header" type="color" value="#18181d">
<input id="headerHex" class="hex" value="#18181d">
</div>

<div class="color">
<label>Акцент</label>
<input id="accent" type="color" value="#ff4fa3">
<input id="accentHex" class="hex" value="#ff4fa3">
</div>

<div class="color">
<label>Исходящие сообщения</label>
<input id="outgoingColor" type="color" value="#ff4fa3">
<input id="outgoingColorHex" class="hex" value="#ff4fa3">
</div>

<div class="color">
<label>Входящие сообщения</label>
<input id="incomingColor" type="color" value="#292930">
<input id="incomingColorHex" class="hex" value="#292930">
</div>

<div class="color">
<label>Текст</label>
<input id="text" type="color" value="#ffffff">
<input id="textHex" class="hex" value="#ffffff">
</div>

<div class="color">
<label>Ссылки</label>
<input id="link" type="color" value="#ff4fa3">
<input id="linkHex" class="hex" value="#ff4fa3">
</div>

<div class="color">
<label>Вторичный текст</label>
<input id="secondary" type="color" value="#9999a3">
<input id="secondaryHex" class="hex" value="#9999a3">
</div>

</div>
</div>

<div class="card">

<div class="title">Фон</div>

<label class="upload">
🖼️ Выбрать изображение
<input id="wallpaper" type="file" accept="image/*">
</label>

<br>

<div class="actions">

<button onclick="removeWallpaper()">
Убрать фон
</button>

<button onclick="randomGradient()">
Градиент
</button>

</div>

</div>

<div class="card">

<div class="title">Создание темы</div>

<div class="actions">

<button onclick="downloadPreview()">
💾 Скачать
</button>

<button class="primary" onclick="createTelegramTheme()">
🎨 Создать тему
</button>

</div>

</div>

</div>

<div class="bottom">

<button onclick="saveTheme()">
💾 Сохранить
</button>

<button class="primary" onclick="createTelegramTheme()">
🎨 Создать
</button>

</div>

<div id="toast" class="toast"></div>

<script>

const SERVER =
"https://theme-studio-production-ec43.up.railway.app";

let platform = "ios";

const $ = id =>
document.getElementById(id);


/* PLATFORM */

function setPlatform(type){

    platform = type;

    $("androidBtn").classList.remove("active");
    $("iosBtn").classList.remove("active");

    if(type === "android"){
        $("androidBtn").classList.add("active");
    }else{
        $("iosBtn").classList.add("active");
    }

}


/* THEME */

function getTheme(){

    return {

        name:$("themeName").value || "Telegram Theme",

        platform:platform,

        colors:{

            background:$("bg").value,

            header:$("header").value,

            accent:$("accent").value,

            outgoing:$("outgoingColor").value,

            incoming:$("incomingColor").value,

            text:$("text").value,

            link:$("link").value,

            secondary:$("secondary").value

        }

    };

}


/* APPLY */

function applyTheme(){

    const t = getTheme();

    $("chat").style.backgroundColor =
        t.colors.background;

    $("previewHeader").style.backgroundColor =
        t.colors.header;

    $("composer").style.backgroundColor =
        t.colors.header;

    $("avatar").style.backgroundColor =
        t.colors.accent;

    $("send").style.backgroundColor =
        t.colors.accent;

    document
    .querySelectorAll(".out")
    .forEach(el =>
        el.style.background =
        t.colors.outgoing
    );

    document
    .querySelectorAll(".in")
    .forEach(el =>
        el.style.background =
        t.colors.incoming
    );

    document
    .querySelectorAll(".message")
    .forEach(el =>
        el.style.color =
        t.colors.text
    );

    $("fakeInput").style.color =
        t.colors.secondary;

}


/* COLORS */

const pairs = [

["bg","bgHex"],
["header","headerHex"],
["accent","accentHex"],
["outgoingColor","outgoingColorHex"],
["incomingColor","incomingColorHex"],
["text","textHex"],
["link","linkHex"],
["secondary","secondaryHex"]

];

pairs.forEach(pair => {

    const color = $(pair[0]);
    const hex = $(pair[1]);

    color.addEventListener("input",() => {

        hex.value =
            color.value.toUpperCase();

        applyTheme();

    });

    hex.addEventListener("change",() => {

        let value =
            hex.value.trim();

        if(!/^#[0-9a-fA-F]{6}$/.test(value)){

            hex.value =
                color.value;

            return;

        }

        color.value =
            value;

        applyTheme();

    });

});


/* PRESETS */

const themes = {

pink:{
background:"#111114",
header:"#18181d",
accent:"#ff4fa3",
outgoing:"#ff4fa3",
incoming:"#292930",
text:"#ffffff"
},

black:{
background:"#050505",
header:"#101010",
accent:"#777777",
outgoing:"#292929",
incoming:"#171717",
text:"#ffffff"
},

blood:{
background:"#160607",
header:"#22090b",
accent:"#ff3030",
outgoing:"#9e1118",
incoming:"#351014",
text:"#ffffff"
},

ocean:{
background:"#07131f",
header:"#0b1e30",
accent:"#2498ff",
outgoing:"#1677c8",
incoming:"#132d43",
text:"#ffffff"
},

purple:{
background:"#10091b",
header:"#1a0e2b",
accent:"#a855f7",
outgoing:"#7936bd",
incoming:"#28183c",
text:"#ffffff"
},

forest:{
background:"#07120c",
header:"#0c1d12",
accent:"#35c978",
outgoing:"#18834a",
incoming:"#14291d",
text:"#ffffff"
},

cyber:{
background:"#05090c",
header:"#081218",
accent:"#00e5ff",
outgoing:"#007f91",
incoming:"#102229",
text:"#ffffff"
},

minimal:{
background:"#eeeeF2",
header:"#ffffff",
accent:"#777777",
outgoing:"#d8d8df",
incoming:"#ffffff",
text:"#111111"
}

};


function preset(type){

    const t =
        themes[type];

    $("bg").value =
        t.background;

    $("bgHex").value =
        t.background.toUpperCase();

    $("header").value =
        t.header;

    $("headerHex").value =
        t.header.toUpperCase();

    $("accent").value =
        t.accent;

    $("accentHex").value =
        t.accent.toUpperCase();

    $("outgoingColor").value =
        t.outgoing;

    $("outgoingColorHex").value =
        t.outgoing.toUpperCase();

    $("incomingColor").value =
        t.incoming;

    $("incomingColorHex").value =
        t.incoming.toUpperCase();

    $("text").value =
        t.text;

    $("textHex").value =
        t.text.toUpperCase();

    applyTheme();

    toast("Стиль применён ✓");

}


/* WALLPAPER */

$("wallpaper").addEventListener(
"change",
function(e){

    const file =
        e.target.files[0];

    if(!file)
        return;

    const url =
        URL.createObjectURL(file);

    $("chat").style.backgroundImage =
        `url("${url}")`;

});


function removeWallpaper(){

    $("chat").style.backgroundImage =
        "none";

    $("wallpaper").value =
        "";

}


function randomGradient(){

    const gradients = [

        "linear-gradient(135deg,#ff4fa3,#7928ca)",

        "linear-gradient(135deg,#0f2027,#203a43,#2c5364)",

        "linear-gradient(135deg,#200122,#6f0000)",

        "linear-gradient(135deg,#141e30,#243b55)",

        "linear-gradient(135deg,#000428,#004e92)",

        "linear-gradient(135deg,#42275a,#734b6d)"

    ];

    $("chat").style.backgroundImage =
        gradients[
            Math.floor(
                Math.random()*gradients.length
            )
        ];

}


/* SAVE */

function saveTheme(){

    localStorage.setItem(
        "themeStudio",
        JSON.stringify(
            getTheme()
        )
    );

    toast("Тема сохранена ✓");

}


/* CREATE */

async function createTelegramTheme(){

    const theme =
        getTheme();

    toast("Создаю тему…");

    try{

        const response =
            await fetch(
                SERVER + "/api/theme",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify(theme)
                }
            );

        const result =
            await response.json();

        if(result.ok){

            toast(
                "🎨 Тема отправлена в Telegram!"
            );

        }else{

            toast(
                "Ошибка: " +
                (
                    result.error ||
                    result.description ||
                    "неизвестная ошибка"
                )
            );

        }

    }catch(error){

        console.error(error);

        toast(
            "Ошибка соединения с сервером"
        );

    }

}


/* LOCAL DOWNLOAD */

function downloadPreview(){

    const theme =
        getTheme();

    const text =
        JSON.stringify(
            theme,
            null,
            2
        );

    const blob =
        new Blob(
            [text],
            {
                type:"application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href =
        url;

    a.download =
        (
            theme.name
            .replace(/[^a-zA-Z0-9а-яА-ЯёЁ_-]/g,"_")
            ||
            "telegram_theme"
        )
        +
        ".json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

}


/* LOAD */

function loadSaved(){

    const saved =
        localStorage.getItem(
            "themeStudio"
        );

    if(!saved)
        return;

    try{

        const t =
            JSON.parse(saved);

        if(t.name)
            $("themeName").value =
                t.name;

        if(t.platform)
            setPlatform(t.platform);

        if(t.colors){

            const c =
                t.colors;

            if(c.background){
                $("bg").value =
                    c.background;
                $("bgHex").value =
                    c.background.toUpperCase();
            }

            if(c.header){
                $("header").value =
                    c.header;
                $("headerHex").value =
                    c.header.toUpperCase();
            }

            if(c.accent){
                $("accent").value =
                    c.accent;
                $("accentHex").value =
                    c.accent.toUpperCase();
            }

            if(c.outgoing){
                $("outgoingColor").value =
                    c.outgoing;
                $("outgoingColorHex").value =
                    c.outgoing.toUpperCase();
            }

            if(c.incoming){
                $("incomingColor").value =
                    c.incoming;
                $("incomingColorHex").value =
                    c.incoming.toUpperCase();
            }

            if(c.text){
                $("text").value =
                    c.text;
                $("textHex").value =
                    c.text.toUpperCase();
            }

            if(c.link){
                $("link").value =
                    c.link;
                $("linkHex").value =
                    c.link.toUpperCase();
            }

            if(c.secondary){
                $("secondary").value =
                    c.secondary;
                $("secondaryHex").value =
                    c.secondary.toUpperCase();
            }

        }

    }catch(e){}

}


/* TOAST */

function toast(text){

    const t =
        $("toast");

    t.textContent =
        text;

    t.style.display =
        "block";

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {
                t.style.display =
                    "none";
            },
            2200
        );

}


/* START */

loadSaved();

applyTheme();

</script>

</body>
</html>
